      lines.push((i + 1) + ". " + T.screenWord + " " + (numbers[r.screen] || "?") + " `" + r.screen + "`" + (s ? " " + s.title : "") +
        (a ? " · " + T.actionWord + " `" + a.id + "` (" + a.label + ")" : ""));
      lines.push("   " + r.text.replace(/\n/g, "\n   "));
    });
    lines.push("", T.footer);
    return lines.join("\n");
  }
  function copyRequests() {
    if (!localRequests.length) { toast(T.nothingToCopy); return; }
    var text = requestText();
    function fallback() {
      panel.innerHTML = "";
      var box2 = h("textarea", { id: "copybox", readonly: true }); box2.value = text;
      panel.appendChild(h("div", { class: "ph" }, h("h3", { text: T.copy }), h("button", { class: "x", type: "button", onclick: closePanel, text: "×" })));
      panel.appendChild(h("div", { class: "sec" }, h("p", { text: T.copyFail }), box2));
      showPanel(); box2.focus(); box2.select();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast(T.copied); }, fallback);
    else fallback();
  }

  // ---------------------------------------------------------------- top bar
  function updateTop() {
    var openIssues = (flow.issues || []).filter(function (i) { return i.status === "open" || i.status === "accepted"; });
    var blocking = findings.some(function (f) { return f.severity === "S1" || f.severity === "S2"; }) ||
      openIssues.some(function (i) { return i.severity === "S1" || i.severity === "S2"; });
    var status = $("status"); status.textContent = blocking ? T.blocking : T.passing; status.className = "status " + (blocking ? "bad" : "good");
    $("findingsBtn").innerHTML = ""; $("findingsBtn").append(T.findings + " ", h("span", { class: "count", text: String(findings.length) }));
    $("copyBtn").innerHTML = ""; $("copyBtn").append(T.copy + " ", h("span", { class: "count", text: String(localRequests.length) }));
  }
  function setupTop() {
    $("title").textContent = flow.title;
    $("goal").textContent = flow.goal;
    document.title = flow.title + " · wireflow";
    var sel = $("scenario");
    sel.appendChild(h("option", { value: "", text: T.pathNone }));
    (flow.scenarios || []).forEach(function (sc) { sel.appendChild(h("option", { value: sc.id, text: "[" + T.kinds[sc.kind || "main"] + "] " + sc.title })); });
    if (!(flow.scenarios || []).length) sel.hidden = true;
    sel.addEventListener("change", function () { state.scenario = sel.value; applyScenario(); });
    if (Object.keys(images).length) {
      var seg = $("viewseg"); seg.hidden = false;
      seg.querySelector('[data-view="wire"]').textContent = T.wire;
      seg.querySelector('[data-view="design"]').textContent = T.design;
      seg.addEventListener("click", function (e) {
        var b = e.target.closest("[data-view]"); if (!b) return;
        state.view = b.getAttribute("data-view");
        seg.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
        render();
      });
    }
    $("findingsBtn").addEventListener("click", openFindings);
    $("copyBtn").addEventListener("click", copyRequests);
    $("copyBtn").addEventListener("contextmenu", function (e) {
      e.preventDefault();
      if (localRequests.length && window.confirm(T.confirmClear)) { localRequests = []; saveLocal(localRequests); refresh(state.selected); toast(T.cleared); }
    });
    $("copyBtn").title = T.clear + " (right-click)";
    $("fitBtn").textContent = T.fit;
    $("fitBtn").addEventListener("click", fit);
    $("zoomIn").addEventListener("click", function () { zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, 1.2); });
    $("zoomOut").addEventListener("click", function () { zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, 1 / 1.2); });
    var legend = $("legend");
    legend.appendChild(h("div", { class: "grid" }, T.legendRows.map(function (r) {
      return [h("span", { class: "tag " + r[0], text: r[0] === "S2" ? "UX S2" : r[0] === "check" ? T.findings : r[0] === "inferred" ? T.inferred : r[0] === "request" ? T.requests : r[0] === "decision" ? T.decisions : T.rationale }), h("span", { text: r[1] })];
    }).reduce(function (a, b) { return a.concat(b); }, [])));
    $("legendBtn").setAttribute("aria-label", T.legend);
    $("legendBtn").addEventListener("click", function () { legend.hidden = !legend.hidden; $("legendBtn").setAttribute("aria-expanded", String(!legend.hidden)); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") { closePanel(); legend.hidden = true; } });
    updateTop();
  }

  setupTop();
  render();
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { drawArrows(); });
  window.addEventListener("resize", function () { drawArrows(); });
})();
</script>
</body>
</html>
